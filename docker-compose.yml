services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oopai
      POSTGRES_USER: oopai
      POSTGRES_PASSWORD: oopai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oopai -d oopai"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
